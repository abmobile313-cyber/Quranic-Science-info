<script id="qs-wa">

};

</script><script id="qs-rev">/* ===== Reviews: students rate their teacher after every class (daily, mandatory), teachers rate every student once a week

.qh-dot.green{background:#4fd98c;box-shadow:0 0 0 3px var(--qbg),0 0 12px #4fd98c}.qh-dot.red{background:#ff5a5a;animation:qhBlink 1s infinite}.qh-dot.dim{background:#6b5b55;box-shadow:0 0 0 3px var(--qbg)}
@keyframes qhBlink{50%{opacity:.3}}
.qh-cbody{flex:1;min-width:0}.qh-acts{display:flex;gap:6px;flex-wrap:wrap}
/* tests */
.qh-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:10px}
.qh-stats>div{display:grid;justify-items:center;align-content:center;gap:2px;padding:14px 6px;text-align:center}
.qh-stats b{font-size:1.5rem;color:var(--qg2)}.qh-stats small{font-size:.7rem;color:var(--qmut)}
.qh-spark{width:100%;height:90px}.qh-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:qhDraw 1.4s .2s ease-out forwards}
@keyframes qhDraw{to{stroke-dashoffset:0}}
.qh-weak{display:grid;grid-template-columns:1fr 90px auto;gap:10px;align-items:center;font-size:.86rem}
.qh-weak i{height:8px;border-radius:9px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}.qh-weak i::after{content:"";position:absolute;inset:0;width:var(--w);background:linear-gradient(90deg,var(--qg2),var(--qr));border-radius:9px}
.qh-weak small,.qh-hist small{color:var(--qmut)}
.qh-hist{display:grid;grid-template-columns:1fr auto 60px;gap:8px;padding:8px 0;border-bottom:1px solid var(--qline);font-size:.88rem}.qh-hist small{text-align:right}
#qhApp.intest .qh-nav{transform:translateX(-50%) translateY(140%);transition:transform .35s}
.qh-test{display:grid;gap:14px}
.qh-bar{height:8px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.qh-bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--qc),var(--qg2));transition:width .4s}
.qh-test .qh-q{padding:22px 18px}.qh-test .qh-q h2{font-size:1.3rem;margin-top:6px}
.qh-opts{display:grid;gap:10px}
.qh-opt{display:flex;align-items:center;gap:12px;padding:15px 14px;text-align:start;font-size:1rem;font-weight:600;transition:transform .15s,border-color .2s,background .2s}
.qh-opt i{flex:0 0 32px;height:32px;display:grid;place-items:center;border-radius:11px;font-style:normal;font-weight:800;background:rgba(255,255,255,.1)}
.qh-opt:active{transform:scale(.98)}
.qh-opt.good{background:linear-gradient(150deg,rgba(60,200,120,.38),rgba(20,90,50,.35));border-color:#5be39a;animation:qhPop .4s var(--qsp)}
.qh-opt.bad{background:linear-gradient(150deg,rgba(255,70,70,.35),rgba(110,20,20,.35));border-color:#ff7070;animation:qhShake .4s}
@keyframes qhPop{40%{transform:scale(1.04)}}@keyframes qhShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qh-result{position:relative;display:grid;justify-items:center;gap:12px;text-align:center;padding:30px 10px}
.qh-result canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* live room */
.qh-room{padding:24px 18px;display:grid;gap:14px;text-align:center;justify-items:center}
.qh-pulse{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(31,182,232,.4),rgba(31,182,232,.05));border:2px solid rgba(31,182,232,.6)}
.qh-pulse.on{background:radial-gradient(circle,rgba(255,70,70,.55),rgba(255,70,70,.05));border-color:#ff6b6b;animation:qhPulse 1.6s infinite}
.qh-pulse span{font-weight:800;letter-spacing:.12em}
@keyframes qhPulse{0%{box-shadow:0 0 0 0 rgba(255,80,80,.55)}100%{box-shadow:0 0 0 26px rgba(255,80,80,0)}}
.qh-check{list-style:none;padding:0;margin:0;display:grid;gap:8px;text-align:start;width:100%}
.qh-check li{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--qline);font-size:.9rem}
.qh-revq{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2)}.qh-revq p{color:#9ff0c3}
/* me */
.qh-me{display:flex;gap:14px;align-items:center;padding:4px}
.qh-av{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;font-weight:800;overflow:hidden;background:linear-gradient(140deg,#14b8a6,var(--qc));box-shadow:0 0 0 3px var(--qg),0 10px 30px rgba(224,164,37,.35)}
.qh-av img{width:100%;height:100%;object-fit:cover}
.qh-heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto}
.qh-heat i{width:14px;height:14px;border-radius:4px;background:rgba(255,255,255,.07)}
.qh-heat i.hol{background:rgba(44,196,242,.12)}.qh-heat i.on{background:linear-gradient(140deg,var(--qg2),var(--qc));box-shadow:0 0 8px rgba(246,213,138,.45)}
.qh-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.qh-badge{display:grid;justify-items:center;gap:3px;padding:12px 6px;border-radius:18px;text-align:center;background:rgba(0,0,0,.22);border:1px solid var(--qline);filter:grayscale(1);opacity:.5}
.qh-badge span{font-size:1.7rem}.qh-badge b{font-size:.78rem}.qh-badge small{font-size:.64rem;color:var(--qmut)}
.qh-badge.on{filter:none;opacity:1;background:linear-gradient(160deg,rgba(246,213,138,.20),rgba(44,196,242,.10));border-color:rgba(242,199,92,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 20px -8px rgba(242,199,92,.5)}
.qh-badge.on span{animation:qhBadge 3s ease-in-out infinite}
@keyframes qhBadge{50%{transform:translateY(-3px) rotate(4deg)}}
.qh-li{padding:6px 0;border-bottom:1px solid var(--qline)}
.qh-empty{justify-items:center;text-align:center;padding:30px 18px}.qh-emo{font-size:3rem;animation:qhBadge 3s infinite}
.qh-load{display:flex;gap:8px;justify-content:center;padding:60px 0}.qh-load i{width:12px;height:12px;border-radius:50%;background:var(--qg2);animation:qhDots 1s infinite}.qh-load i:nth-child(2){animation-delay:.15s;background:var(--qc)}.qh-load i:nth-child(3){animation-delay:.3s;background:#14b8a6}
@keyframes qhDots{50%{transform:translateY(-10px);opacity:.5}}
/* staggered reveal */
#qhApp .rv{animation:qhRv .55s var(--qsp) both;animation-delay:calc(var(--i,0)*60ms)}
@keyframes qhRv{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
::view-transition-old(root){animation:qhFadeOut .18s ease-in both}::view-transition-new(root){animation:qhFadeIn .28s ease-out both}
@keyframes qhFadeOut{to{opacity:0}}@keyframes qhFadeIn{from{opacity:0}}
#qhApp.rm *,#qhApp.rm *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#qhApp *{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (prefers-contrast:more){#qhApp .qh-card,#qhApp .qh-cls,#qhApp .qh-btn{border-width:2px!important;background:#0b121b!important}}
