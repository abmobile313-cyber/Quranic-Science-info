<!doctype html>
<html lang="ur" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f0508">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fahmul Quraan">
<title>Fahmul Quraan by Quranic Science</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ui2.css">
</head>
<body>
<script src="splash.js"></script>
<div id="app">
  <header class="top">
    <button id="btnMenu" class="ib" aria-label="Surahs"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div id="title"><i id="tApp">FAHMUL QURAAN</i><b class="ar" id="tAr"></b><small id="tSub"></small></div>
    <button id="btnLang" class="ib t2" aria-label="Language"></button>
    <button id="btnTheme" class="ib t2" aria-label="Theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
    <button id="btnRead" class="ib" aria-label="Read"><svg viewBox="0 0 24 24"><path d="M12 6v14M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/></svg></button>
    <button id="btnSet" class="ib" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></button>
  </header>

  <main id="main">
    <div class="col-a">
      <section id="words" class="glass" dir="rtl" aria-label="Lafz ba lafz"></section>
      <section id="stage" class="lab mini">
        <canvas id="wsMini"></canvas><div class="fade"></div>
        <div id="labTop"></div>
        <div id="labCap"><b id="labM"></b><small id="labN"></small></div>
        <button id="btnLabR" class="ib small" aria-label="Replay"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
        <button id="btnFull" class="ib small" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </section>
      <section id="wordcard" class="glass"></section>
      <section id="story">
        <h4 id="storyH"></h4>
        <div class="story-box"><canvas id="cv"></canvas><video id="sv" muted loop playsinline preload="metadata"></video><div id="cx"></div><div id="sw"></div>
          <button id="btnReplay" class="ib small" aria-label="Replay scene"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg></button>
          <button id="btnFullS" class="ib small" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <div id="sctl"><button id="sClose" class="ib" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span></span>
            <button id="sPrev" class="ib"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button id="sPlay" class="ib gold"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" style="fill:currentColor;stroke:none"/></svg></button>
            <button id="sNext" class="ib"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
          <div id="ayahNo"></div></div>
      </section>
    </div>
    <div class="col-b">
      <section id="trans" class="glass"></section>
      <section id="nz" class="glass"></section>
      <button id="bMushaf" class="mush"></button>
      <footer id="credits"></footer>
    </div>
  </main>

  <nav id="bar">
    <button id="bPrev" class="nb lab" aria-label="Prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="lPrev"></span></button>
    <button id="bPick" class="nb pill" aria-label="Pick ayah"><span id="pickTxt"></span></button>
    <button id="bPlay" class="nb big" aria-label="Play"><svg id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="icoPause" viewBox="0 0 24 24" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <button id="bNext" class="nb lab" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg><span id="lNext"></span></button>
  </nav>

  <aside id="menu" class="sheet" hidden><div class="sheet-in glass"><h3 id="menuT"></h3><div id="menuList"></div></div></aside>
  <aside id="settings" class="sheet" hidden><div class="sheet-in glass"><h3 id="setT"></h3><div id="setBody"></div></div></aside>
  <aside id="pick" class="sheet" hidden><div class="sheet-in glass"><h3 id="pickT"></h3><div id="pickGrid"></div></div></aside>
  <div id="reader" hidden>
    <div class="rtop"><button id="rClose" class="ib" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="rTitle"></div>
      <button id="rList" class="ib sm" aria-label="Surah / Para list"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button id="rLay" class="ib sm" aria-label="Layout"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h8"/></svg></button>
      <button id="rMinus" class="ib sm"><b>A</b></button><button id="rPlus" class="ib sm"><b style="font-size:20px">A</b></button></div>
    <div id="rstage"><div id="rpage"><div id="rhd"></div><div id="rin"></div><div id="rpn"></div></div></div>
    <div id="rhz" hidden><span id="rhDaur"></span><span id="rhSt"></span><button id="rhMode" class="po sm"></button><button id="rhHold" class="po sm" hidden></button><button id="rhSet" class="ib sm" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></button><button id="rhStop" class="ib sm" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/></svg></button></div>
    <div id="rbar"><button id="rNext" class="ib" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="rPlay" class="ib gold"><svg id="rIcoP" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg id="rIcoS" viewBox="0 0 24 24" style="display:none"><path d="M7 6h4v12H7zM13 6h4v12h-4z"/></svg></button>
      <span id="rPg"></span>
      <button id="rMic" class="ib" aria-label="Hafiz"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 3zM6 11a6 6 0 0012 0M12 17v4"/></svg></button>
      <button id="rPrev" class="ib" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div id="rpop" hidden></div>
    <div id="rrep" hidden></div>
  </div>
  <div id="web" hidden><div class="web-top"><button id="webBack" class="ib" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><img src="icons/qs-logo.webp" alt="Quranic Science"><b>Quranic Science</b><button id="webOut" class="ib" aria-label="Open in browser"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button></div><iframe id="webf" title="Quranic Science"></iframe></div>
  <div id="toast" hidden></div>
  <div id="install" hidden></div>
</div>
<script src="sfx.js"></script>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script src="composer.js"></script>
<script src="three.min.js"></script>
<script src="labspecs.js"></script>
<script src="lemspecs.js"></script>
<script src="lemspecs2.js"></script>
<script src="story3d.js"></script>
<script src="story3da.js"></script>
<script src="reciters.js"></script>
<script src="hafiz.js"></script>
<script src="hk.js"></script>
<script src="surahnames.js"></script>
<script src="data.js"></script>
<script src="conv.js"></script>
<script src="wstage.js"></script>
<script src="reader.js"></script>
<script src="i18n.js"></script>
<script src="content_ur.js"></script>
<script src="makharij.js"></script>
<script src="onboard.js"></script>
<script src="app.js"></script>
</body>
</html>
