<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7dc86"/><stop offset="1" stop-color="#b8841c"/></linearGradient>
    <radialGradient id="p" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff1c4"/><stop offset=".4" stop-color="#f27a95"/><stop offset="1" stop-color="#b8264a"/></radialGradient>
    <radialGradient id="c" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d6"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#c76a08"/></radialGradient>
    <!-- one stretch of the bel (vine), drawn for the top edge: 32 wide, 32 high -->
    <g id="seg">
      <rect x="0" y="0" width="32" height="32" fill="#0f6662"/>
      <rect x="0" y="2.2" width="32" height="1.6" fill="url(#g)"/>
      <rect x="0" y="28.2" width="32" height="1.6" fill="url(#g)"/>
      <path d="M0 16 C6 9 10 9 16 16 S26 23 32 16" fill="none" stroke="url(#g)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M8 11.5 C6 6.5 9 4.8 12 6 C11.5 9 10.5 10.8 8 11.5Z" fill="#59c08f"/>
      <path d="M24 20.5 C26 25.5 23 27.2 20 26 C20.5 23 21.5 21.2 24 20.5Z" fill="#59c08f"/>
      <g transform="translate(16 16)">
        <circle r="5.6" fill="url(#p)"/>
        <g fill="#ffd7e0" opacity=".9"><circle cx="0" cy="-4" r="1.6"/><circle cx="3.8" cy="-1.2" r="1.6"/><circle cx="2.4" cy="3.3" r="1.6"/><circle cx="-2.4" cy="3.3" r="1.6"/><circle cx="-3.8" cy="-1.2" r="1.6"/></g>
        <circle r="1.7" fill="#ffd45a"/>
      </g>
      <circle cx="3" cy="22" r="1.3" fill="#ffd45a"/><circle cx="29" cy="10" r="1.3" fill="#ffd45a"/>
    </g>
    <!-- corner rosette: 32 x 32 -->
    <g id="cor">
      <rect x="0" y="0" width="32" height="32" fill="#0f6662"/>
      <rect x="2.2" y="2.2" width="27.6" height="27.6" rx="3" fill="none" stroke="url(#g)" stroke-width="1.6"/>
      <g transform="translate(16 16)">
        <g fill="url(#c)"><ellipse rx="3.4" ry="9" transform="rotate(0)"/><ellipse rx="3.4" ry="9" transform="rotate(45)"/><ellipse rx="3.4" ry="9" transform="rotate(90)"/><ellipse rx="3.4" ry="9" transform="rotate(135)"/></g>
        <circle r="5.4" fill="url(#p)"/><circle r="2" fill="#ffe27a"/>
      </g>
    </g>
  </defs>
  <use href="#cor" x="0" y="0"/><use href="#cor" x="64" y="0"/><use href="#cor" x="0" y="64"/><use href="#cor" x="64" y="64"/>
  <use href="#seg" x="32" y="0"/>
  <use href="#seg" transform="translate(64 96) rotate(180)"/>
  <use href="#seg" transform="translate(0 64) rotate(-90)"/>
  <use href="#seg" transform="translate(96 32) rotate(90)"/>
</svg>
