<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arsalan PA — Login</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1d1a;color:#f3ead3;font:16px system-ui,sans-serif;text-align:center;padding:24px}
.c{max-width:360px}h1{font-size:22px;margin:0 0 8px}p{opacity:.75;line-height:1.5}button,a.b{display:inline-block;margin-top:14px;background:#d4a53a;color:#1a1305;border:0;border-radius:14px;padding:14px 22px;font:600 16px system-ui;text-decoration:none}</style></head>
<body><div class="c"><h1>Arsalan PA</h1><p id="m">Website ka data jodne ke liye owner Google account se login karein.<br>Login for website data (owner account only).</p>
<button id="go">Google se login / Sign in with Google</button><div id="back"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const CFG={apiKey:"AIzaSyCCoqjw2BzgWcal6OVBqONYOB7x--WP12g",authDomain:"quranicscience-682ff.firebaseapp.com",projectId:"quranicscience-682ff",storageBucket:"quranicscience-682ff.firebasestorage.app",messagingSenderId:"573259128290",appId:"1:573259128290:web:ac11b77238e1bd7354edbb"};
firebase.initializeApp(CFG);
document.getElementById('go').onclick=async()=>{
  const m=document.getElementById('m');
  try{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({login_hint:'quranicscience01@gmail.com'});
    const r=await firebase.auth().signInWithPopup(p);const c=r.credential||{};
    if(!r.user||(r.user.email||'').toLowerCase()!=='quranicscience01@gmail.com'){await firebase.auth().signOut();m.textContent='Yeh owner account nahi hai / Not the owner account.';return}
    const url='arsalanpa://auth?id='+encodeURIComponent(c.idToken||'')+'&at='+encodeURIComponent(c.accessToken||'');
    m.textContent='Login ho gaya ✅ — app par wapas ja raha hoon… / Returning to the app…';
    document.getElementById('back').innerHTML='<a class="b" href="'+url+'">Arsalan PA kholein / Open the app</a>';
    location.href=url;
  }catch(e){m.textContent='Login nahi hua: '+(e.code||e.message)}
};
</script></body></html>
