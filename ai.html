<style>

*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(122,20,36,.45),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(44,196,242,.10),transparent 60%),var(--bg);color:var(--fg);font:400 16px/1.6 Outfit,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
body.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",Outfit,serif;line-height:2.1}

.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ar{font-family:"Amiri Quran","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate}

.top{position:sticky;top:0;z-index:20;background:rgba(15,10,12,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0}
.brand img{width:40px;height:40px;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 6px 20px -6px rgba(227,170,60,.5)}
.brand b{display:block;font:700 15px/1.15 Outfit;letter-spacing:.01em}.brand small{display:block;color:var(--gold);font:600 11px/1.2 Outfit;letter-spacing:.14em;text-transform:uppercase}
.sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 11px;font:600 13px/1 Outfit;color:var(--mut)}

.who{display:flex;align-items:center;gap:8px}
.av{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:700;color:var(--gold);overflow:hidden;border:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--card2);color:var(--fg);padding:11px 18px;border-radius:14px;font:600 15px/1.2 Outfit;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s}
body.ur .btn,body.hi .btn{font-family:inherit}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn.pri{background:linear-gradient(135deg,var(--gold),#c98a26);color:#1a0f08;border:0;box-shadow:0 10px 26px -12px rgba(227,170,60,.8)}
.btn.mar{background:linear-gradient(135deg,var(--mar2),var(--mar));border:0;color:#fff}
.btn.cy{background:rgba(44,196,242,.12);border-color:rgba(44,196,242,.45);color:#bfefff}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
/* hero */
.hero{padding-block:44px 22px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:28px}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font:600 12px/1 Outfit;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(227,170,60,.07)}
h1{font:800 clamp(32px,5.4vw,54px)/1.06 Outfit;margin:14px 0 12px;letter-spacing:-.02em;text-wrap:balance}
body.ur h1{font-family:"Noto Nastaliq Urdu",serif;font-weight:600;line-height:1.7;font-size:clamp(26px,4.4vw,42px)}
body.hi h1{font-family:"Noto Sans Devanagari",sans-serif;line-height:1.3}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--gold2),var(--gold),var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mut);font-size:17px;max-width:56ch}
.orb{position:relative;aspect-ratio:1;max-width:340px;width:100%;margin:auto}
.orb img{width:100%;height:100%;border-radius:32%;box-shadow:0 30px 80px -30px rgba(227,170,60,.6),0 0 0 1px var(--line);animation:float 6s ease-in-out infinite}
.orb:before{content:"";position:absolute;inset:-8%;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(44,196,242,.35),transparent 40%,rgba(227,170,60,.35),transparent 70%);filter:blur(28px);animation:spin 14s linear infinite;z-index:-1}

.feat{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.feat span{font-size:13px;padding:6px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut)}

.sec{padding-block:18px 36px}
.sec h2{font:700 24px/1.3 Outfit;margin:0 0 14px}body.ur .sec h2{font-family:"Noto Nastaliq Urdu";line-height:2}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:860px){.cards{grid-template-columns:1fr}}
.cc{position:relative;background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.cc:after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(227,170,60,.18),transparent 65%)}

.cc p{margin:0;color:var(--mut);font-size:14.5px}
.price{display:flex;align-items:baseline;gap:10px;margin-top:4px}.price b{font:800 30px/1 Outfit;color:var(--gold2)}.price small{color:var(--mut)}

.cc .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}

.mini{font-size:13px;color:var(--mut)}

.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;flex:none}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font:800 20px Outfit}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}.stat b{display:block;font:800 18px Outfit;color:var(--gold2)}.stat small{color:var(--mut);font-size:12px}
.week{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.week summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:12px;align-items:center}
.week summary::-webkit-details-marker{display:none}
.wkn{flex:none;font:700 12px/1 Outfit;padding:7px 10px;border-radius:10px;background:rgba(227,170,60,.12);color:var(--gold);border:1px solid var(--line)}

.day.lock{opacity:.5;cursor:not-allowed}.day.soon{opacity:.45}
.day em{font-style:normal;font-size:12px;color:var(--mut)}

.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}

.eq{display:flex;gap:3px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--gold);border-radius:2px;height:4px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:22px;width:min(460px,100%);max-height:90vh;overflow:auto}

.foot{border-top:1px solid var(--line);padding-block:22px calc(80px + env(safe-area-inset-bottom,0px));color:var(--mut);font-size:13px}
.foot .wrap{display:flex;gap:10px 18px;flex-wrap:wrap;justify-content:space-between}
canvas#cv{width:100%;height:auto;border-radius:12px;border:1px solid var(--line)}
</style>

/* ============ audio ============ */
let voiceEl = null, qariEl = null, rec = null, recUrl = null, recChunks = [];
function stopAll() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) {} [voiceEl, qariEl].forEach(a => { try { a && a.pause(); } catch (e) {} }); if (rec && rec.state === "recording") try { rec.stop(); } catch (e) {} $$(".playing").forEach(e => e.classList.remove("playing")); }
/* voice: recorded Urdu voice (mp3) when it exists; otherwise the phone's own free voice reads the step */
function tts(text, lang) {
  const box = $("#vo"), sy = window.speechSynthesis; if (!sy || !text) return;
  sy.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/[\u0600-\u06FF\u0750-\u077F]+/g, " ")); u.lang = lang; u.rate = .95;
  const v = sy.getVoices().find(x => x.lang && x.lang.toLowerCase().startsWith(lang.slice(0, 2))); if (v) u.voice = v;
  box && box.classList.add("playing"); u.onend = u.onerror = () => box && box.classList.remove("playing"); sy.speak(u);
}
function playVoice(src, m) {
  stopAll(); m = m || LESSON.data && LESSON.data.moments[LESSON.i];
  if (LANG === "en") return tts(m && m.en, "en-IN");
  voiceEl = new Audio(src); const box = $("#vo"); box && box.classList.add("playing");
  voiceEl.onended = () => box && box.classList.remove("playing");
  voiceEl.onerror = () => { box && box.classList.remove("playing"); tts(m && m.hi, "hi-IN"); };
  voiceEl.play().catch(() => { box && box.classList.remove("playing"); });
}
async function playQari(list, btn) {
  stopAll(); btn && btn.classList.add("playing");
  for (const q of list) {
    const src = q.w ? QARI_WORD(q.s, q.a, q.w) : QARI_AYAH(q.s, q.a);
    await new Promise(r => { qariEl = new Audio(src); qariEl.onended = qariEl.onerror = r; qariEl.play().catch(r); });
    if (!btn || !btn.classList.contains("playing")) break;
    await new Promise(r => setTimeout(r, 250));
  }
  btn && btn.classList.remove("playing");
}
async function toggleRec(btn, playBtn) {
  if (rec && rec.state === "recording") { rec.stop(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    recChunks = []; rec = new MediaRecorder(st);
    rec.ondataavailable = e => recChunks.push(e.data);
    rec.onstop = () => { st.getTracks().forEach(x => x.stop()); if (recUrl) URL.revokeObjectURL(recUrl); recUrl = URL.createObjectURL(new Blob(recChunks, { type: rec.mimeType || "audio/webm" }));
      btn.classList.remove("on"); btn.textContent = "🎙️ " + t("rec"); playBtn.disabled = false; };
    stopAll(); rec.start(); btn.classList.add("on"); btn.textContent = "⏹ " + t("stop");
  } catch (e) { toast(t("micNo")); }
}

const AIX = { model: null, tried: false, hist: [] };
async function ustadKnowledge() {
  const [ot, oa] = await Promise.all([outline("tajweed"), outline("arabic")]);

  if (LESSON.data && /lesson=/.test(location.hash)) cur = "\nTHE STUDENT IS NOW ON THIS LESSON (" + LESSON.id + "):\n" + LESSON.data.moments.map(m => m.en + (m.ar ? " [" + m.ar + "]" : "")).join("\n");
  return `You are "AI Ustad", the teacher inside "Learn with Quranic Science AI" (quranicscience.info), a self-paced course for Tajweed (Hafs 'an 'Asim, Indo-Pak 15-line mushaf conventions) and beginner Arabic speaking/Qur'anic Arabic.
RULES (very important):
1. Answer ONLY about Tajweed, Qur'an reading, Arabic language and this course. For other topics, politely say you only help with this course.
2. Be accurate. Use the standard rules of Tajweed for Hafs 'an 'Asim via ash-Shatibiyyah (e.g. madd muttasil and munfasil 4-5 counts, madd lazim 6, ghunnah 2 counts, qalqalah letters قطب جد, isti'la letters خص ضغط قظ, izhar letters ء ه ع ح غ خ, idgham letters ينمو and ل ر, iqlab before ب, ikhfa 15 letters).
3. If you are not fully sure, say so honestly and advise asking a qualified teacher (the "Learn with real teacher" option or WhatsApp +91 9272527913). Never invent rules, ayat, references or hadith.
4. Never give fatwas or rulings on halal/haram, fiqh disputes or personal matters; refer to a qualified scholar.
5. When quoting the Qur'an, quote exactly in Arabic with diacritics and give the surah:ayah. Do not paraphrase the Arabic.
6. Reply in the student's language: if they write in Urdu script reply in Urdu, Devanagari reply in Hindi-Urdu, Roman Urdu reply in Roman Urdu, English reply in English. Keep answers short (under 120 words), kind and clear, with one example.
7. Plain text only; no markdown symbols. For a list start lines with •.
COURSE SYLLABUS:
${syl(ot, "TAJWEED (72 lessons)")}
${syl(oa, "ARABIC (72 lessons)")}
PRICES: Tajweed with AI ₹1,499 ($18), Arabic with AI ₹2,999 ($36), both ₹3,999 ($48). Certificate after all 72 lessons and 70% in the final exam.${cur}`;
}
async function aiModel() {

  try {
    const v = "12.4.0", { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
      ac = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app-check.js`),
      { getAI, getGenerativeModel, GoogleAIBackend } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-ai.js`);
    const app = initializeApp(FB, "qs-ai-ustad");
    try { ac.initializeAppCheck(app, { provider: new ac.ReCaptchaEnterpriseProvider(RECAPTCHA), isTokenAutoRefreshEnabled: true }); } catch (e) {}
    AIX.model = getGenerativeModel(getAI(app, { backend: new GoogleAIBackend() }), { model: AI_MODEL, systemInstruction: await ustadKnowledge() });
