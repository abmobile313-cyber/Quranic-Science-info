name: Build Fahm Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['fahm-android/**', 'fahm/**', '.github/workflows/fahm-android.yml']
permissions:
  contents: write
concurrency: { group: fahm-android, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Bundle the web app inside the APK
        run: |
          rm -rf fahm-android/app/src/main/assets
          mkdir -p fahm-android/app/src/main/assets
          cp -r fahm fahm-android/app/src/main/assets/fahm
          find fahm-android/app/src/main/assets/fahm/video -name '*.mp4' -delete 2>/dev/null || true
      - name: Build APK
        working-directory: fahm-android
        env:
          FAHM_VERSION_CODE: ${{ github.run_number }}
          FAHM_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: Fahm-apk, path: fahm-android/app/build/outputs/apk/release/app-release.apk }
      - name: Publish APK to download/
        run: |
          mkdir -p download
          cp fahm-android/app/build/outputs/apk/release/app-release.apk download/Fahm.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Fahm.apk
          git commit -m "Fahm Android app build ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push
