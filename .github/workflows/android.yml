name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-src.zip']
permissions:
  contents: write
concurrency: { group: android-app, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unpack app project
        run: rm -rf android-build && mkdir android-build && unzip -q android-src.zip -d android-build
      - name: Signing key
        env:
          KS: ${{ secrets.QS_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > android-build/app/qs-release.jks; echo "KEY_SOURCE=owner" >> "$GITHUB_ENV"
          else keytool -genkeypair -keystore android-build/app/qs-release.jks -alias quranicscience -keyalg RSA -keysize 2048 -validity 12000 -storepass quranicscience -keypass quranicscience -dname "CN=Quranic Science, C=IN"; echo "KEY_SOURCE=temporary" >> "$GITHUB_ENV"; fi
      - name: Build APK
        working-directory: android-build
        env:
          QS_VERSION_CODE: ${{ github.run_number }}
          QS_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Put the APK on the website
        run: |
          mkdir -p download
          cp android-build/app/build/outputs/apk/release/app-release.apk download/QuranicScience.apk
          printf '{"version":"1.0.%s","key":"%s","built":"%s"}\n' "${{ github.run_number }}" "$KEY_SOURCE" "$(date -u +%FT%TZ)" > download/app.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download
          git commit -m "Android app build ${{ github.run_number }} [skip ci]" || exit 0
          git pull --rebase origin main
          git push
