name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android-src.zip', '.github/workflows/android.yml']
permissions:
  contents: write
concurrency: { group: android-app, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Unpack app project
        run: rm -rf android-build && mkdir android-build && unzip -q android-src.zip -d android-build
      - name: Build APK (unsigned; it is signed privately before publishing)
        working-directory: android-build
        env:
          QS_VERSION_CODE: ${{ github.run_number }}
          QS_VERSION_NAME: 1.1.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Save the unsigned APK and the signing tool
        run: |
          mkdir -p app-build
          cp android-build/app/build/outputs/apk/release/app-release-unsigned.apk app-build/QuranicScience-unsigned.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" app-build/apksigner.jar
          printf '{"version":"1.1.%s","built":"%s"}\n' "${{ github.run_number }}" "$(date -u +%FT%TZ)" > app-build/build.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-build
          git commit -m "Android app build ${{ github.run_number }} (unsigned) [skip ci]" || exit 0
          git pull --rebase origin main
          git push
